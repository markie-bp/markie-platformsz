<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Markie | Social Links</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       BODY
    ========================= */

    body {
      font-family: Arial, Helvetica, sans-serif;

      background: #111;

      color: #111;

      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      overflow-x: hidden;
    }


    /* =========================
       MAIN SCREEN

       DEFAULT = PC / LAPTOP
       16:9
    ========================= */

    .screen {

      width: 100vw;

      min-height: 100vh;

      background: #f5f5f8;

      position: relative;

      overflow-x: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    .header {

      height: 32vh;

      min-height: 230px;

      background: #191919;

      position: relative;
    }


    /* =========================
       SHARE BUTTON
    ========================= */

    .share-btn {

      position: absolute;

      top: 30px;
      right: 35px;

      width: 65px;
      height: 65px;

      border: none;
      border-radius: 50%;

      background: #111;

      color: white;

      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: 0.25s;
    }


    .share-btn:hover {

      background: #333;

      transform: scale(1.08);
    }


    .share-btn svg {

      width: 30px;
      height: 30px;
    }


    /* =========================
       PROFILE
    ========================= */

    .profile {

      text-align: center;

      position: relative;
    }


    .profile-image {

      width: clamp(170px, 16vw, 270px);

      height: clamp(170px, 16vw, 270px);

      border-radius: 50%;

      object-fit: cover;

      position: relative;

      margin-top: clamp(-135px, -8vw, -90px);

      border: 4px solid #f5f5f8;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.20);
    }


    .profile-name {

      margin-top: 30px;

      font-size: clamp(38px, 4vw, 56px);

      font-weight: 600;
    }


    /* =========================
       SOCIAL CONTAINER
    ========================= */

    .social-container {

      width: min(720px, 70vw);

      margin: 60px auto;

      padding-left: 65px;
    }


    /* =========================
       SOCIAL CARD
    ========================= */

    .social-card {

      position: relative;

      background: white;

      min-height: 135px;

      margin-bottom: 35px;

      display: flex;
      align-items: center;

      text-decoration: none;

      color: #111;

      padding-left: 85px;
      padding-right: 30px;

      box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.10);

      transition: 0.25s;
    }


    .social-card:hover {

      transform: translateY(-6px);

      box-shadow:
        0 25px 45px rgba(0, 0, 0, 0.15);
    }


    /* =========================
       SOCIAL ICON
    ========================= */

    .social-icon {

      position: absolute;

      left: -55px;

      width: 110px;
      height: 110px;

      display: flex;
      justify-content: center;
      align-items: center;

      box-shadow:
        0 15px 25px rgba(0, 0, 0, 0.20);
    }


    .social-icon svg {

      width: 55px;
      height: 55px;
    }


    /* FACEBOOK */

    .facebook {

      background: #1877f2;
    }


    /* TIKTOK */

    .tiktok {

      background: black;
    }


    /* INSTAGRAM */

    .instagram {

      background:
        linear-gradient(
          135deg,
          #833ab4,
          #c13584,
          #e1306c,
          #fd1d1d,
          #fcb045
        );
    }


    /* =========================
       SOCIAL TEXT
    ========================= */

    .social-info {

      flex: 1;

      min-width: 0;
    }


    .social-title {

      font-size: clamp(22px, 2vw, 32px);

      margin-bottom: 8px;
    }


    .social-link {

      font-size: clamp(15px, 1.5vw, 21px);

      color: #aaa;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================
       ARROW
    ========================= */

    .arrow {

      margin-left: auto;

      font-size: 40px;

      color: #bbb;

      transition: 0.25s;
    }


    .social-card:hover .arrow {

      transform: translateX(7px);

      color: #111;
    }



    /* =====================================================
       PHONE MODE
       9:16
    ===================================================== */

    @media (max-width: 700px) {

      body {

        background: #111;
      }


      .screen {

        width: 100%;

        min-height: 100vh;

        /* PHONE STYLE = 9:16 */
        aspect-ratio: 9 / 16;

        background: #f5f5f8;
      }


      .header {

        height: 26vh;

        min-height: 175px;
      }


      .share-btn {

        width: 48px;
        height: 48px;

        top: 20px;
        right: 20px;
      }


      .share-btn svg {

        width: 22px;
        height: 22px;
      }


      .profile-image {

        width: 145px;
        height: 145px;

        margin-top: -72px;
      }


      .profile-name {

        font-size: 35px;

        margin-top: 22px;
      }


      .social-container {

        width: calc(100% - 48px);

        margin: 40px 0 40px 48px;

        padding-left: 0;

        padding-right: 14px;
      }


      .social-card {

        min-height: 105px;

        margin-bottom: 27px;

        padding-left: 60px;

        padding-right: 15px;
      }


      .social-icon {

        left: -38px;

        width: 78px;
        height: 78px;
      }


      .social-icon svg {

        width: 40px;
        height: 40px;
      }


      .social-title {

        font-size: 20px;
      }


      .social-link {

        font-size: 13px;
      }


      .arrow {

        font-size: 28px;
      }

    }



    /* =====================================================
       VERY SMALL PHONE
    ===================================================== */

    @media (max-width: 360px) {

      .profile-image {

        width: 125px;
        height: 125px;

        margin-top: -62px;
      }


      .profile-name {

        font-size: 30px;
      }


      .social-title {

        font-size: 17px;
      }


      .social-link {

        font-size: 11px;
      }


      .social-card {

        min-height: 95px;
      }


      .social-icon {

        width: 70px;
        height: 70px;

        left: -34px;
      }

    }

  </style>
</head>


<body>


<div class="screen">


  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">


    <button
      class="share-btn"
      onclick="sharePage()"
    >


      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 16V4m0 0L8 8m4-4 4 4M6 12H4v8h16v-8h-2"
        />

      </svg>


    </button>


  </div>



  <!-- =========================
       PROFILE
  ========================== -->

  <div class="profile">


    <img
      src="markiecole.jpg.jpg"
      class="profile-image"
      alt="Markie"
    >


    <h1 class="profile-name">

      Markie

    </h1>


  </div>



  <!-- =========================
       SOCIAL LINKS
  ========================== -->

  <div class="social-container">



    <!-- FACEBOOK -->

    <a
      href="https://www.facebook.com/share/1DrLSkReYB/?mibextid=wwXIfr"
      target="_blank"
      class="social-card"
    >


      <div class="social-icon facebook">


        <svg
          viewBox="0 0 24 24"
          fill="white"
        >

          <path
            d="M14 8h3V4h-3c-3.3 0-5 2-5 5v2H6v4h3v9h4v-9h3.2l.8-4H13V9c0-.7.3-1 1-1z"
          />

        </svg>


      </div>



      <div class="social-info">


        <div class="social-title">

          FACEBOOK PAGE

        </div>


        <div class="social-link">

          facebook.com/Markie

        </div>


      </div>



      <div class="arrow">

        →

      </div>


    </a>




    <!-- TIKTOK -->

    <a
      href="https://www.tiktok.com/@hezooblox?_r=1&_t=ZS-99rPvvlsihO"
      target="_blank"
      class="social-card"
    >


      <div class="social-icon tiktok">


        <svg viewBox="0 0 24 24">


          <path
            fill="#25F4EE"
            transform="translate(-1 1)"
            d="M16 3c.5 2.5 2 4 4.5 4v4c-1.7 0-3.2-.5-4.5-1.4V16a6 6 0 1 1-5-5.9V14a2.5 2.5 0 1 0 1 2V3h4z"
          />


          <path
            fill="#FE2C55"
            transform="translate(1 0)"
            d="M16 3c.5 2.5 2 4 4.5 4v4c-1.7 0-3.2-.5-4.5-1.4V16a6 6 0 1 1-5-5.9V14a2.5 2.5 0 1 0 1 2V3h4z"
          />


          <path
            fill="white"
            d="M16 3c.5 2.5 2 4 4.5 4v4c-1.7 0-3.2-.5-4.5-1.4V16a6 6 0 1 1-5-5.9V14a2.5 2.5 0 1 0 1 2V3h4z"
          />


        </svg>


      </div>



      <div class="social-info">


        <div class="social-title">

          TikTok

        </div>


        <div class="social-link">

          tiktok.com/@hezooblox

        </div>


      </div>



      <div class="arrow">

        →

      </div>


    </a>




    <!-- INSTAGRAM -->

    <a
      href="https://www.instagram.com/mayk.uu?stkn=angyODdseDhueHc1&utm_source=qr"
      target="_blank"
      class="social-card"
    >


      <div class="social-icon instagram">


        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
        >


          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="5"
          />


          <circle
            cx="12"
            cy="12"
            r="4"
          />


          <circle
            cx="17.5"
            cy="6.5"
            r="1"
            fill="white"
            stroke="none"
          />


        </svg>


      </div>



      <div class="social-info">


        <div class="social-title">

          Instagram

        </div>


        <div class="social-link">

          instagram.com/mayk.uu

        </div>


      </div>



      <div class="arrow">

        →

      </div>


    </a>


  </div>


</div>



<script>

  function sharePage() {


    if (navigator.share) {


      navigator.share({

        title: "Markie",

        text: "Check out Markie's social media!",

        url: window.location.href

      });


    } else {


      navigator.clipboard.writeText(
        window.location.href
      );


      alert("Link copied!");


    }

  }

</script>


</body>
</html>
